<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WASSCE Result Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .drag-active {
            border-color: #3b82f6;
            background-color: #eff6ff;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans antialiased text-gray-900 flex flex-col items-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-3xl w-full space-y-8 bg-white p-10 rounded-xl shadow-lg">
        <div>
            <h2 class="text-center text-3xl font-extrabold text-gray-900">
                WASSCE Result Analyzer
            </h2>
            <p class="mt-2 text-center text-sm text-gray-600">
                Upload your results PDF (max 450 pages) to generate a detailed Excel analysis.
            </p>
        </div>

        <div id="upload-container" class="mt-8">
            <div id="drop-zone" class="border-2 border-dashed border-gray-300 rounded-lg p-12 text-center transition-colors duration-200 ease-in-out cursor-pointer hover:border-blue-400 hover:bg-gray-50">
                <svg class="mx-auto h-12 w-12 text-gray-400" stroke="currentColor" fill="none" viewBox="0 0 48 48" aria-hidden="true">
                    <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <div class="mt-4 flex text-sm text-gray-600 justify-center">
                    <label for="file-upload" class="relative cursor-pointer bg-white rounded-md font-medium text-blue-600 hover:text-blue-500 focus-within:outline-none focus-within:ring-2 focus-within:ring-offset-2 focus-within:ring-blue-500">
                        <span>Upload a file</span>
                        <input id="file-upload" name="file-upload" type="file" accept=".pdf" class="sr-only">
                    </label>
                    <p class="pl-1">or drag and drop</p>
                </div>
                <p class="text-xs text-gray-500 mt-2">
                    PDF up to 50MB
                </p>
            </div>

            <div id="file-info" class="hidden mt-4 p-4 bg-blue-50 rounded-md flex justify-between items-center">
                <div class="flex items-center">
                    <svg class="h-6 w-6 text-blue-500 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
                    </svg>
                    <span id="filename-display" class="text-sm font-medium text-gray-900 truncate max-w-xs"></span>
                </div>
                <button id="remove-file" class="text-sm text-red-600 hover:text-red-800 font-medium">Remove</button>
            </div>
        </div>

        <div id="error-message" class="hidden rounded-md bg-red-50 p-4 mt-4">
            <div class="flex">
                <div class="flex-shrink-0">
                    <svg class="h-5 w-5 text-red-400" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.28 7.22a.75.75 0 00-1.06 1.06L8.94 10l-1.72 1.72a.75.75 0 101.06 1.06L10 11.06l1.72 1.72a.75.75 0 101.06-1.06L11.06 10l1.72-1.72a.75.75 0 00-1.06-1.06L10 8.94 8.28 7.22z" clip-rule="evenodd" />
                    </svg>
                </div>
                <div class="ml-3">
                    <h3 class="text-sm font-medium text-red-800" id="error-text">Error with upload</h3>
                </div>
            </div>
        </div>

        <div class="mt-6 flex flex-col sm:flex-row gap-4">
            <button id="analyze-btn" disabled class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:bg-gray-400 disabled:cursor-not-allowed transition-colors">
                <span class="absolute left-0 inset-y-0 flex items-center pl-3" id="analyze-icon">
                    <svg class="h-5 w-5 text-blue-500 group-hover:text-blue-400 disabled:text-gray-300" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd" />
                    </svg>
                </span>
                <span id="analyze-text">Analyze Data</span>

                <!-- Spinner -->
                <svg id="analyze-spinner" class="hidden animate-spin -ml-1 mr-3 h-5 w-5 text-white absolute left-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </button>

            <a id="download-btn" href="#" class="hidden group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 transition-colors">
                <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                    <svg class="h-5 w-5 text-green-500 group-hover:text-green-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                        <path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd" />
                    </svg>
                </span>
                Download Excel File
            </a>
        </div>

        <div id="success-notification" class="hidden rounded-md bg-green-50 p-4 mt-4">
            <div class="flex">
                <div class="flex-shrink-0">
                    <svg class="h-5 w-5 text-green-400" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
                    </svg>
                </div>
                <div class="ml-3">
                    <h3 class="text-sm font-medium text-green-800">Analysis completed successfully! Your file is ready to download.</h3>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const dropZone = document.getElementById('drop-zone');
            const fileUpload = document.getElementById('file-upload');
            const fileInfo = document.getElementById('file-info');
            const filenameDisplay = document.getElementById('filename-display');
            const removeFileBtn = document.getElementById('remove-file');
            const analyzeBtn = document.getElementById('analyze-btn');
            const downloadBtn = document.getElementById('download-btn');
            const errorMessage = document.getElementById('error-message');
            const errorText = document.getElementById('error-text');
            const successNotification = document.getElementById('success-notification');

            const analyzeIcon = document.getElementById('analyze-icon');
            const analyzeText = document.getElementById('analyze-text');
            const analyzeSpinner = document.getElementById('analyze-spinner');

            let currentFile = null;

            // Prevent default drag behaviors
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                dropZone.addEventListener(eventName, preventDefaults, false);
                document.body.addEventListener(eventName, preventDefaults, false);
            });

            // Highlight drop zone when item is dragged over it
            ['dragenter', 'dragover'].forEach(eventName => {
                dropZone.addEventListener(eventName, highlight, false);
            });

            ['dragleave', 'drop'].forEach(eventName => {
                dropZone.addEventListener(eventName, unhighlight, false);
            });

            // Handle dropped files
            dropZone.addEventListener('drop', handleDrop, false);

            // Handle selected files
            fileUpload.addEventListener('change', function(e) {
                if (this.files && this.files[0]) {
                    handleFile(this.files[0]);
                }
            });

            // Allow clicking on dropzone to open file dialog
            dropZone.addEventListener('click', () => {
                if (!currentFile) {
                    fileUpload.click();
                }
            });

            removeFileBtn.addEventListener('click', resetUI);

            analyzeBtn.addEventListener('click', uploadAndAnalyze);

            function preventDefaults(e) {
                e.preventDefault();
                e.stopPropagation();
            }

            function highlight(e) {
                dropZone.classList.add('drag-active');
            }

            function unhighlight(e) {
                dropZone.classList.remove('drag-active');
            }

            function handleDrop(e) {
                const dt = e.dataTransfer;
                const file = dt.files[0];
                handleFile(file);
            }

            function handleFile(file) {
                hideError();

                if (file.type !== 'application/pdf') {
                    showError("Please upload a PDF file.");
                    return;
                }

                if (file.size > 50 * 1024 * 1024) { // 50MB
                    showError("File is too large. Maximum size is 50MB.");
                    return;
                }

                currentFile = file;
                filenameDisplay.textContent = file.name;
                dropZone.classList.add('hidden');
                fileInfo.classList.remove('hidden');
                analyzeBtn.disabled = false;

                // Hide download/success from previous run if any
                downloadBtn.classList.add('hidden');
                successNotification.classList.add('hidden');
            }

            function resetUI(e) {
                if (e) preventDefaults(e);
                currentFile = null;
                fileUpload.value = "";
                dropZone.classList.remove('hidden');
                fileInfo.classList.add('hidden');
                analyzeBtn.disabled = true;
                downloadBtn.classList.add('hidden');
                successNotification.classList.add('hidden');
                hideError();
            }

            function showError(msg) {
                errorText.textContent = msg;
                errorMessage.classList.remove('hidden');
            }

            function hideError() {
                errorMessage.classList.add('hidden');
            }

            function setLoading(isLoading) {
                analyzeBtn.disabled = isLoading;
                if (isLoading) {
                    analyzeText.textContent = "Analyzing... (This may take a minute)";
                    analyzeIcon.classList.add('hidden');
                    analyzeSpinner.classList.remove('hidden');
                    removeFileBtn.disabled = true;
                } else {
                    analyzeText.textContent = "Analyze Data";
                    analyzeIcon.classList.remove('hidden');
                    analyzeSpinner.classList.add('hidden');
                    removeFileBtn.disabled = false;
                }
            }

            async function uploadAndAnalyze() {
                if (!currentFile) return;

                setLoading(true);
                hideError();
                downloadBtn.classList.add('hidden');
                successNotification.classList.add('hidden');

                const formData = new FormData();
                formData.append('file', currentFile);

                try {
                    const response = await fetch('/analyze', {
                        method: 'POST',
                        body: formData
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.error || 'Failed to analyze file');
                    }

                    // Success! Show download button and notification
                    downloadBtn.href = data.download_url;
                    downloadBtn.classList.remove('hidden');
                    successNotification.classList.remove('hidden');

                } catch (error) {
                    showError(error.message);
                } finally {
                    setLoading(false);
                }
            }
        });
    </script>
</body>
</html>
